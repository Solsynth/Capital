<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Persynth interface placeholder — pet island window and conversation console">
  <title>Persynth interface placeholder</title>
  <defs>
    <linearGradient id="px-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F2F4" />
      <stop offset="0.55" stop-color="#EDE7EB" />
      <stop offset="1" stop-color="#E3DAE0" />
    </linearGradient>
    <radialGradient id="px-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97706" stop-opacity="0.40" />
      <stop offset="0.55" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="1" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="px-aura-soft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E1B1B6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#E1B1B6" stop-opacity="0" />
    </radialGradient>
    <pattern id="px-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#20252C" opacity="0.055" />
    </pattern>
    <filter id="px-lift" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#20252C" flood-opacity="0.18" />
    </filter>
    <filter id="px-lift-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#20252C" flood-opacity="0.16" />
    </filter>
    <style>
      .px-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .px-ui { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#px-canvas)" />
  <rect width="1600" height="1000" fill="url(#px-dots)" />
  <circle cx="580" cy="620" r="470" fill="url(#px-aura-soft)" />

  <!-- Conversation console -->
  <g filter="url(#px-lift)">
    <rect x="520" y="150" width="900" height="640" rx="26" fill="#FBF9FA" />
    <rect x="520" y="150" width="900" height="640" rx="26" fill="none" stroke="#20252C" stroke-opacity="0.08" />
    <path d="M520 204h900" stroke="#20252C" stroke-opacity="0.07" />
    <circle cx="556" cy="177" r="6" fill="#20252C" opacity="0.14" />
    <circle cx="578" cy="177" r="6" fill="#20252C" opacity="0.14" />
    <circle cx="600" cy="177" r="6" fill="#20252C" opacity="0.14" />
    <rect x="676" y="166" width="212" height="22" rx="11" fill="#20252C" opacity="0.05" />
    <text x="700" y="182" class="px-mono" font-size="13" fill="#20252C" opacity="0.45">insight · personality core</text>

    <!-- Sidebar threads -->
    <rect x="520" y="204" width="196" height="586" fill="#20252C" opacity="0.03" />
    <path d="M716 204v586" stroke="#20252C" stroke-opacity="0.07" />
    <rect x="544" y="232" width="128" height="14" rx="7" fill="#20252C" opacity="0.16" />
    <g fill="#D97706" opacity="0.16">
      <rect x="544" y="268" width="148" height="34" rx="10" />
    </g>
    <rect x="560" y="279" width="96" height="12" rx="6" fill="#9A5500" opacity="0.55" />
    <g fill="#20252C" opacity="0.08">
      <rect x="544" y="314" width="148" height="34" rx="10" />
      <rect x="544" y="360" width="148" height="34" rx="10" />
      <rect x="544" y="406" width="148" height="34" rx="10" />
      <rect x="544" y="452" width="148" height="34" rx="10" />
    </g>

    <!-- Message bubbles -->
    <g>
      <rect x="752" y="238" width="330" height="86" rx="20" fill="#E8E3E6" />
      <rect x="776" y="266" width="266" height="12" rx="6" fill="#20252C" opacity="0.22" />
      <rect x="776" y="290" width="204" height="12" rx="6" fill="#20252C" opacity="0.16" />

      <rect x="964" y="352" width="410" height="104" rx="20" fill="#D97706" opacity="0.16" />
      <rect x="988" y="380" width="308" height="12" rx="6" fill="#9A5500" opacity="0.5" />
      <rect x="988" y="404" width="352" height="12" rx="6" fill="#9A5500" opacity="0.34" />
      <rect x="988" y="428" width="188" height="12" rx="6" fill="#9A5500" opacity="0.28" />

      <!-- Tool trace chips -->
      <g>
        <rect x="752" y="486" width="132" height="30" rx="15" fill="#20252C" opacity="0.06" />
        <circle cx="772" cy="501" r="5" fill="#D97706" opacity="0.7" />
        <rect x="786" y="496" width="76" height="10" rx="5" fill="#20252C" opacity="0.2" />
        <rect x="896" y="486" width="152" height="30" rx="15" fill="#20252C" opacity="0.06" />
        <circle cx="916" cy="501" r="5" fill="#D97706" opacity="0.7" />
        <rect x="930" y="496" width="96" height="10" rx="5" fill="#20252C" opacity="0.2" />
      </g>

      <rect x="752" y="540" width="360" height="86" rx="20" fill="#E8E3E6" />
      <rect x="776" y="566" width="288" height="12" rx="6" fill="#20252C" opacity="0.22" />
      <rect x="776" y="590" width="232" height="12" rx="6" fill="#20252C" opacity="0.16" />
    </g>

    <!-- Composer -->
    <rect x="752" y="668" width="622" height="66" rx="20" fill="#F2EEF1" />
    <rect x="752" y="668" width="622" height="66" rx="20" fill="none" stroke="#20252C" stroke-opacity="0.07" />
    <circle cx="786" cy="701" r="13" fill="#D97706" />
    <path d="M781 701h10M786 696v10" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" />
    <rect x="818" y="694" width="246" height="14" rx="7" fill="#20252C" opacity="0.12" />
    <rect x="1310" y="684" width="40" height="34" rx="14" fill="#D97706" opacity="0.9" />
    <path d="M1322 701h16M1332 695l6 6-6 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Pet island window -->
  <g filter="url(#px-lift-sm)">
    <circle cx="300" cy="612" r="210" fill="url(#px-aura)" />
    <rect x="120" y="392" width="360" height="440" rx="34" fill="#FBFAFA" />
    <rect x="120" y="392" width="360" height="440" rx="34" fill="none" stroke="#20252C" stroke-opacity="0.09" />
    <rect x="196" y="412" width="208" height="24" rx="12" fill="#20252C" opacity="0.05" />
    <text x="222" y="429" class="px-ui" font-size="13" font-weight="600" fill="#20252C" opacity="0.45">Mochi</text>
    <circle cx="158" cy="424" r="6" fill="#20252C" opacity="0.14" />

    <text x="300" y="612" class="px-mono" font-size="104" font-weight="600" fill="#D97706" text-anchor="middle" opacity="0.92">0.0</text>
    <text x="300" y="664" class="px-ui" font-size="15" fill="#20252C" opacity="0.42" text-anchor="middle">Mochi is here</text>

    <!-- Mood chips -->
    <g>
      <rect x="158" y="700" width="76" height="28" rx="14" fill="#D97706" opacity="0.16" />
      <rect x="174" y="710" width="44" height="8" rx="4" fill="#9A5500" opacity="0.45" />
      <rect x="244" y="700" width="76" height="28" rx="14" fill="#E1B1B6" opacity="0.5" />
      <rect x="260" y="710" width="44" height="8" rx="4" fill="#20252C" opacity="0.22" />
      <rect x="330" y="700" width="76" height="28" rx="14" fill="#20252C" opacity="0.06" />
      <rect x="346" y="710" width="44" height="8" rx="4" fill="#20252C" opacity="0.22" />
    </g>

    <!-- Energy / affection meters -->
    <rect x="158" y="748" width="248" height="10" rx="5" fill="#20252C" opacity="0.07" />
    <rect x="158" y="748" width="176" height="10" rx="5" fill="#D97706" opacity="0.55" />
    <rect x="158" y="772" width="248" height="10" rx="5" fill="#20252C" opacity="0.07" />
    <rect x="158" y="772" width="128" height="10" rx="5" fill="#E1B1B6" />

    <!-- Mic button -->
    <circle cx="300" cy="812" r="17" fill="#20252C" opacity="0.85" />
    <path d="M300 804a4 4 0 014 4v6a4 4 0 01-8 0v-6a4 4 0 014-4zM292 814a8 8 0 0016 0M300 822v4" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>
</svg>
