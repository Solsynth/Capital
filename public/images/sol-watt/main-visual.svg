    </pattern>
    <filter id="sw-lift" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#3F3A33" flood-opacity="0.2" />
    </filter>
    <style>
      .sw-ui { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .sw-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

