<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="SolWatt interface placeholder — workspace shell with mail, boards and drive">
  <title>SolWatt interface placeholder</title>
  <defs>
    <linearGradient id="sw-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF7EC" />
      <stop offset="0.5" stop-color="#F6ECDC" />
      <stop offset="1" stop-color="#EDE0CD" />
    </linearGradient>
    <radialGradient id="sw-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2BE53" stop-opacity="0.42" />
      <stop offset="1" stop-color="#F2BE53" stop-opacity="0" />
    </radialGradient>
    <pattern id="sw-dots" width="34" height="34" patternUnits="userSpaceOnUse">
