<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="GroovyBox interface — glacier-paper music player with shelves, lyrics and floating dock">
  <title>GroovyBox interface</title>
  <defs>
    <linearGradient id="gb-canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F9FB" />
      <stop offset="0.55" stop-color="#E8F4F7" />
      <stop offset="1" stop-color="#DCECF1" />
    </linearGradient>
    <radialGradient id="gb-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EB0C7" stop-opacity="0.28" />
      <stop offset="1" stop-color="#2EB0C7" stop-opacity="0" />
    </radialGradient>
    <pattern id="gb-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#18363D" opacity="0.055" />
    </pattern>
    <filter id="gb-lift" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#122B31" flood-opacity="0.16" />
    </filter>
    <style>
      .gb-ui { font-family: "Nunito", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .gb-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#gb-canvas)" />
  <rect width="1600" height="1000" fill="url(#gb-dots)" />
  <circle cx="1220" cy="230" r="440" fill="url(#gb-glow)" />
  <circle cx="320" cy="780" r="340" fill="url(#gb-glow)" />

  <g filter="url(#gb-lift)">
    <!-- App shell (glacier paper) -->
    <rect x="140" y="100" width="1320" height="780" rx="28" fill="#F9FCFD" />
    <rect x="140" y="100" width="1320" height="780" rx="28" fill="none" stroke="#18363D" stroke-opacity="0.08" />

    <!-- Title bar -->
    <circle cx="184" cy="134" r="6" fill="#18363D" opacity="0.14" />
    <circle cx="206" cy="134" r="6" fill="#18363D" opacity="0.14" />
    <circle cx="228" cy="134" r="6" fill="#18363D" opacity="0.14" />
    <rect x="280" y="121" width="170" height="26" rx="13" fill="#2EB0C7" opacity="0.14" />
    <circle cx="298" cy="134" r="6" fill="#2EB0C7" />
    <text x="314" y="139" class="gb-ui" font-size="13" font-weight="700" fill="#166F80">GroovyBox</text>

    <!-- Search pill -->
    <rect x="1140" y="120" width="280" height="28" rx="14" fill="#18363D" opacity="0.05" />
    <rect x="1164" y="130" width="110" height="8" rx="4" fill="#18363D" opacity="0.18" />

    <!-- Left navigation rail (tonal, no divider) -->
    <rect x="160" y="172" width="184" height="688" rx="20" fill="#EFF6F8" />
    <g>
      <rect x="176" y="192" width="152" height="42" rx="14" fill="#2EB0C7" opacity="0.16" />
      <circle cx="200" cy="213" r="7" fill="#2EB0C7" />
      <rect x="218" y="208" width="68" height="10" rx="5" fill="#166F80" opacity="0.7" />

      <circle cx="200" cy="264" r="7" fill="#18363D" opacity="0.24" />
      <rect x="218" y="259" width="56" height="10" rx="5" fill="#18363D" opacity="0.22" />

      <circle cx="200" cy="312" r="7" fill="#18363D" opacity="0.24" />
      <rect x="218" y="307" width="76" height="10" rx="5" fill="#18363D" opacity="0.22" />

      <circle cx="200" cy="360" r="7" fill="#18363D" opacity="0.24" />
      <rect x="218" y="355" width="62" height="10" rx="5" fill="#18363D" opacity="0.22" />

      <!-- Sources section -->
      <rect x="184" y="424" width="60" height="8" rx="4" fill="#18363D" opacity="0.15" />
      <rect x="176" y="448" width="152" height="38" rx="12" fill="#FFFFFF" opacity="0.75" />
      <circle cx="198" cy="467" r="6" fill="#2EB0C7" />
      <rect x="214" y="462" width="84" height="9" rx="4.5" fill="#18363D" opacity="0.25" />

      <rect x="176" y="496" width="152" height="38" rx="12" fill="#FFFFFF" opacity="0.75" />
      <circle cx="198" cy="515" r="6" fill="#16A34A" opacity="0.75" />
      <rect x="214" y="510" width="72" height="9" rx="4.5" fill="#18363D" opacity="0.25" />

      <rect x="176" y="544" width="152" height="38" rx="12" fill="#FFFFFF" opacity="0.75" />
      <circle cx="198" cy="563" r="6" fill="#18363D" opacity="0.3" />
      <rect x="214" y="558" width="64" height="9" rx="4.5" fill="#18363D" opacity="0.25" />
    </g>

    <!-- Main content shelves -->
    <rect x="374" y="182" width="160" height="18" rx="9" fill="#18363D" opacity="0.22" />

    <!-- Album shelf row -->
    <g>
      <rect x="374" y="220" width="164" height="164" rx="20" fill="#2EB0C7" opacity="0.2" />
      <circle cx="456" cy="302" r="36" fill="#2EB0C7" opacity="0.45" />
      <circle cx="456" cy="302" r="12" fill="#F9FCFD" />
      <rect x="374" y="396" width="120" height="11" rx="5.5" fill="#18363D" opacity="0.28" />
      <rect x="374" y="414" width="82" height="9" rx="4.5" fill="#18363D" opacity="0.14" />

      <rect x="562" y="220" width="164" height="164" rx="20" fill="#7DD3E3" opacity="0.3" />
      <rect x="606" y="264" width="76" height="76" rx="16" fill="#2EB0C7" opacity="0.38" />
      <rect x="562" y="396" width="134" height="11" rx="5.5" fill="#18363D" opacity="0.28" />
      <rect x="562" y="414" width="90" height="9" rx="4.5" fill="#18363D" opacity="0.14" />

      <rect x="750" y="220" width="164" height="164" rx="20" fill="#18363D" opacity="0.06" />
      <circle cx="832" cy="302" r="32" fill="#18363D" opacity="0.14" />
      <rect x="750" y="396" width="112" height="11" rx="5.5" fill="#18363D" opacity="0.28" />
      <rect x="750" y="414" width="76" height="9" rx="4.5" fill="#18363D" opacity="0.14" />
    </g>

    <!-- Smart shuffle / island cards -->
    <rect x="374" y="458" width="136" height="16" rx="8" fill="#18363D" opacity="0.2" />
    <g>
      <rect x="374" y="490" width="260" height="84" rx="20" fill="#EFF6F8" />
      <rect x="394" y="510" width="44" height="44" rx="12" fill="#2EB0C7" opacity="0.35" />
      <rect x="452" y="518" width="128" height="11" rx="5.5" fill="#18363D" opacity="0.25" />
      <rect x="452" y="538" width="88" height="9" rx="4.5" fill="#18363D" opacity="0.13" />

      <rect x="654" y="490" width="260" height="84" rx="20" fill="#EFF6F8" />
      <rect x="674" y="510" width="44" height="44" rx="12" fill="#18363D" opacity="0.14" />
      <rect x="732" y="518" width="140" height="11" rx="5.5" fill="#18363D" opacity="0.25" />
      <rect x="732" y="538" width="96" height="9" rx="4.5" fill="#18363D" opacity="0.13" />
    </g>

    <!-- Right pane: Active track & synced lyrics -->
    <rect x="948" y="172" width="480" height="584" rx="24" fill="#EFF6F8" />
    <rect x="978" y="202" width="132" height="132" rx="20" fill="#2EB0C7" />
    <rect x="1008" y="232" width="72" height="72" rx="16" fill="#FFFFFF" opacity="0.92" />
    <circle cx="1040" cy="276" r="10" fill="#2EB0C7" />
    <rect x="1046" y="248" width="5" height="28" rx="2.5" fill="#2EB0C7" />
    <rect x="1046" y="248" width="14" height="6" rx="3" fill="#2EB0C7" />

    <rect x="1132" y="236" width="200" height="16" rx="8" fill="#18363D" opacity="0.32" />
    <rect x="1132" y="264" width="132" height="11" rx="5.5" fill="#18363D" opacity="0.18" />
    <rect x="1132" y="294" width="94" height="24" rx="12" fill="#2EB0C7" opacity="0.16" />

    <!-- Synced lyrics lines -->
    <g>
      <rect x="978" y="382" width="240" height="12" rx="6" fill="#18363D" opacity="0.14" />
      <rect x="978" y="424" width="310" height="16" rx="8" fill="#166F80" opacity="0.85" />
      <rect x="978" y="450" width="210" height="10" rx="5" fill="#2EB0C7" opacity="0.55" />
      <rect x="978" y="492" width="280" height="12" rx="6" fill="#18363D" opacity="0.14" />
      <rect x="978" y="534" width="230" height="12" rx="6" fill="#18363D" opacity="0.14" />
      <rect x="978" y="576" width="265" height="12" rx="6" fill="#18363D" opacity="0.14" />
      <rect x="978" y="618" width="190" height="12" rx="6" fill="#18363D" opacity="0.14" />
    </g>

    <!-- Floating liquid-glass now-playing dock -->
    <g filter="url(#gb-lift)">
      <rect x="374" y="776" width="1054" height="72" rx="36" fill="#FFFFFF" opacity="0.92" />
      <rect x="374" y="776" width="1054" height="72" rx="36" fill="none" stroke="#2EB0C7" stroke-opacity="0.28" stroke-width="1.5" />
      <rect x="394" y="790" width="44" height="44" rx="14" fill="#2EB0C7" />
      <rect x="454" y="798" width="160" height="11" rx="5.5" fill="#18363D" opacity="0.34" />
      <rect x="454" y="818" width="104" height="9" rx="4.5" fill="#18363D" opacity="0.16" />

      <!-- Transport controls -->
      <circle cx="900" cy="812" r="20" fill="#2EB0C7" />
      <path d="M895 804l12 8-12 8z" fill="#FFFFFF" />
      <path d="M852 805l-10 7 10 7z" fill="#18363D" opacity="0.35" />
      <path d="M948 805l10 7-10 7z" fill="#18363D" opacity="0.35" />

      <!-- Progress bar -->
      <rect x="1010" y="809" width="320" height="6" rx="3" fill="#18363D" opacity="0.1" />
      <rect x="1010" y="809" width="142" height="6" rx="3" fill="#2EB0C7" />
    </g>
  </g>
</svg>
